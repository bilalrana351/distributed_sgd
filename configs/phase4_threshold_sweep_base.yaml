# Phase 4 – Threshold Sweep Base Config
#
# This config is used by experiments/threshold_sweep.py as the BASE.
# The sweep script programmatically overrides the controller thresholds
# listed below. You can also run this manually with any specific
# threshold combination you want to test.
#
# Scenario: Persistent straggler (Scenario A) — most sensitive to thresholds.
# Short run (total_steps=500) so each sweep point is fast.
#
# Run manually (example):
#   python src/hybrid/launcher.py --nworkers 2 \
#       --config configs/phase4_threshold_sweep_base.yaml
#
# Automated sweep:
#   python experiments/threshold_sweep.py

dataset:   "cifar10"
data_root: "./data"
model:     "resnet18"

# run_id is overridden per sweep point by threshold_sweep.py
run_id:      "sweep_base"
scenario_id: "sA_persistent_straggler"

lr:    0.01
seed:  42

total_steps: 500
batch_size:  32

mode_lock: "none"

param_pull_every:   5
grad_queue_maxsize: 200

val_interval_steps: 500   # single validation at end for speed
val_num_batches:    30

log_interval_steps: 50
ps_poll_timeout:    0.5
sync_poll_interval: 0.005

max_cpu_threads:        2
num_workers_dataloader: 0

log_dir:        "./logs/sweep"
checkpoint_dir: "./checkpoints/sweep"

# These values are the starting-point defaults; the sweep script overrides them
controller:
  start_mode:    "sync"
  eval_interval: 40
  cooldown_steps: 120
  decision_window: 2
  ema_alpha:    0.08
  window_size:  15
  straggler_var_high:   0.18   # SWEEP TARGET
  grad_var_low:         0.85   # SWEEP TARGET
  grad_var_high:        0.90
  loss_trend_threshold: 0.06
  straggler_var_low:    0.08   # SWEEP TARGET (cooldown_steps also swept)

straggler:
  enabled: true
  worker_id: 1
  delay_seconds: 1.5
  start_step: 0
  end_step: 500

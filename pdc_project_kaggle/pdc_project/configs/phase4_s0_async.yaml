# Phase 4 – Scenario 0 (Homogeneous) – Pure Async Baseline
#
# No straggler. Controller disabled via mode_lock=async.
# Shows async performance on a fair, homogeneous workload.
#
# Run:
#   python src/hybrid/launcher.py --nworkers 2 --config configs/phase4_s0_async.yaml

dataset:   "cifar10"
data_root: "./data"
model:     "resnet18"

run_id:      "p4_s0_async"
scenario_id: "s0_homogeneous"

lr:    0.01
seed:  42

total_steps: 800
batch_size:  32

# Lock mode so controller never fires — pure async throughout
mode_lock: "async"

param_pull_every:   5
grad_queue_maxsize: 200

val_interval_steps: 200
val_num_batches:    30

log_interval_steps: 50
ps_poll_timeout:    0.5
sync_poll_interval: 0.005

max_cpu_threads:        2
num_workers_dataloader: 0

log_dir:        "./logs"
checkpoint_dir: "./checkpoints"

controller:
  start_mode:    "async"
  eval_interval: 40
  cooldown_steps: 150
  decision_window: 2
  ema_alpha:    0.08
  window_size:  15
  straggler_var_high:   0.20
  grad_var_low:         0.80
  grad_var_high:        0.90
  loss_trend_threshold: 0.06
  straggler_var_low:    0.12

straggler:
  enabled: false
  worker_id: 1
  delay_seconds: 0.0
  start_step: 0
  end_step: 800

# Phase 1 extra-conservative profile for 4-worker DDP on low-resource Windows laptops.

dataset: "cifar10"
data_root: "./data"

model: "resnet18"

# Very small settings to maximize stability.
epochs: 3
batch_size: 8
lr: 0.1
momentum: 0.9
weight_decay: 0.0005
lr_milestones: [2]
lr_gamma: 0.1

distributed: true
backend: "gloo"
use_cuda: false
num_workers: 0

# 4 processes can oversubscribe CPU quickly on laptops.
max_cpu_threads: 1
log_interval_batches: 100

log_dir: "./logs"
checkpoint_dir: "./checkpoints"
checkpoint_every: 5

master_addr: "127.0.0.1"
master_port: 29500
